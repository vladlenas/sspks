; SSpkS overrides on top of php.ini-production
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 128M
; The first scan hashes every package once; give big folders time.
max_execution_time = 120
opcache.enable = 1
opcache.validate_timestamps = 0
zend.assertions = -1
; SSpkS uses no sessions. Turning upload progress off also closes the path
; of CVE-2026-109619 (defense in depth; the real fix is PHP >= 8.4.27).
session.upload_progress.enabled = 0
