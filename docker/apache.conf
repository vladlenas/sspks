ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Download statistics: one line per request for a package, read by
# src/Stats/DownloadStats.php. Only time, status, method, path, Range and
# Referer are written; no IP addresses, no user agents.
SetEnvIf Request_URI "^/packages/[^/]+\.spk$" sspks_download
LogFormat "%{sec}t\t%>s\t%m\t%U\t%{Range}i\t%{Referer}i" sspks_download

<VirtualHost *:8080>
    DocumentRoot /app/public
    DirectoryIndex index.php

    <Directory /app/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /app/public/assets>
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    # Package downloads are served by Apache directly (fast, supports resume).
    # Only *.spk files are reachable, no directory listing.
    Alias /packages/ /packages/
    <Directory /packages>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all denied
        <Files "*.spk">
            Require all granted
            ForceType application/octet-stream
        </Files>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"

    # Through a shell: if /cache is not writable, the lines are discarded
    # instead of Apache failing to start or restarting the logger forever.
    CustomLog "|$mkdir -p /cache/stats 2>/dev/null; cat >> /cache/stats/downloads.log 2>/dev/null || exec cat > /dev/null" sspks_download env=sspks_download

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
